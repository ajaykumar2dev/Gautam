<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Privacy-safe quality workflow placeholder</title>
  <desc id="desc">An abstract blue and teal quality workflow with generic connected stages and no real laboratory, report, or patient information.</desc>
  <defs>
    <linearGradient id="bg" x1="52" y1="38" x2="948" y2="958" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFF6FF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CCFBF1"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#2563EB" stroke-opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="21" stdDeviation="21" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <path fill="url(#bg)" d="M0 0h1000v1000H0z"/>
  <path fill="url(#grid)" d="M0 0h1000v1000H0z"/>
  <circle cx="892" cy="106" r="208" fill="#2563EB" opacity="0.08"/>
  <circle cx="94" cy="903" r="203" fill="#14B8A6" opacity="0.09"/>

