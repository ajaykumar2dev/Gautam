<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Privacy-safe credential placeholder</title>
  <desc id="desc">An abstract preview frame for a future verified professional certificate with blank generic lines and no real credential details.</desc>
  <defs>
    <linearGradient id="bg" x1="91" y1="16" x2="1104" y2="817" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0E7FF"/>
      <stop offset="0.48" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CCFBF1"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="25" stdDeviation="23" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <pattern id="micro" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#2563EB" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <path fill="url(#bg)" d="M0 0h1200v820H0z"/>
  <path fill="url(#micro)" d="M0 0h1200v820H0z"/>
  <circle cx="1109" cy="76" r="219" fill="#2563EB" opacity="0.08"/>
  <circle cx="67" cy="763" r="218" fill="#14B8A6" opacity="0.09"/>

  <g transform="translate(62 57)">
    <rect width="357" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.94" stroke="#BFDBFE"/>
    <circle cx="27" cy="25" r="7" fill="#14B8A6"/>
    <text x="48" y="31" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ILLUSTRATED PLACEHOLDER</text>
  </g>

  <g transform="translate(190 146) rotate(-2 410 270)" filter="url(#shadow)">
    <rect width="820" height="540" rx="35" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/>
    <rect x="28" y="28" width="764" height="484" rx="22" fill="none" stroke="#1E3A8A" stroke-width="3"/>
    <rect x="45" y="45" width="730" height="450" rx="15" fill="none" stroke="#14B8A6" stroke-width="1.5" stroke-dasharray="4 8"/>

    <circle cx="410" cy="102" r="31" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/>
    <path d="M410 83v38m-19-19h38" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
    <rect x="268" y="156" width="284" height="20" rx="10" fill="#1E3A8A" opacity="0.87"/>
    <rect x="317" y="201" width="186" height="12" rx="6" fill="#94A3B8" opacity="0.65"/>
    <rect x="176" y="261" width="468" height="13" rx="6.5" fill="#CBD5E1"/>
    <rect x="225" y="297" width="370" height="13" rx="6.5" fill="#CBD5E1"/>
    <rect x="286" y="333" width="248" height="13" rx="6.5" fill="#DBEAFE"/>

    <g transform="translate(627 363)">
      <path d="m55 92-31 71 45-17 20 43 29-70Z" fill="#1E3A8A"/>
      <path d="m92 93 31 70-45-17-20 43-28-70Z" fill="#0F766E"/>
      <circle cx="74" cy="74" r="67" fill="url(#seal)"/>
      <circle cx="74" cy="74" r="47" fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="4" stroke-dasharray="5 7"/>
      <path d="m45 75 20 20 39-47" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <path d="M115 427h236" stroke="#1E3A8A" stroke-width="3" opacity="0.55"/>
    <path d="M142 448h182" stroke="#94A3B8" stroke-width="9" stroke-linecap="round" opacity="0.52"/>
    <text x="410" y="386" text-anchor="middle" fill="#2563EB" fill-opacity="0.12" font-family="Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="7" transform="rotate(-12 410 386)">PLACEHOLDER</text>
  </g>

  <text x="1138" y="773" text-anchor="end" fill="#1E3A8A" fill-opacity="0.7" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">NOT A REAL CREDENTIAL · CONCEPT ART</text>
