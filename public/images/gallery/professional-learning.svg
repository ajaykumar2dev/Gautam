    <text x="47" y="30" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ILLUSTRATED PLACEHOLDER</text>
  </g>

  <g transform="translate(126 179)" filter="url(#shadow)">
    <rect width="748" height="425" rx="38" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/>
    <rect x="31" y="31" width="686" height="323" rx="26" fill="url(#screen)"/>
