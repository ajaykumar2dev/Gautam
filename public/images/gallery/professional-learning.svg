<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Privacy-safe professional learning placeholder</title>
  <desc id="desc">An abstract healthcare learning environment with non-identifiable figures, a presentation screen, and no real event or personal information.</desc>
  <defs>
    <linearGradient id="bg" x1="63" y1="21" x2="934" y2="969" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFF6FF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CCFBF1"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#2563EB" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <path fill="url(#bg)" d="M0 0h1000v1000H0z"/>
