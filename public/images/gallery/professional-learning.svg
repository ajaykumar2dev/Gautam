    <rect x="344" y="261" width="151" height="19" rx="9.5" fill="#99F6E4" opacity="0.6"/>
    <path d="M304 425h140l-18 55H322l-18-55Z" fill="#1E3A8A"/>
    <rect x="267" y="476" width="214" height="28" rx="14" fill="#1E3A8A"/>
  </g>

  <g transform="translate(130 634)">
    <path d="M88 211c0-76 48-125 113-125s113 49 113 125" fill="#DBEAFE" stroke="#93C5FD" stroke-width="3"/>
