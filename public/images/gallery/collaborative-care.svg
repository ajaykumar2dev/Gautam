<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Privacy-safe collaborative care placeholder</title>
  <desc id="desc">An abstract network of non-identifiable healthcare team figures representing collaboration, with no real people or institutional details.</desc>
  <defs>
    <linearGradient id="bg" x1="43" y1="28" x2="851" y2="1174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFF6FF"/>
      <stop offset="0.5" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CCFBF1"/>
    </linearGradient>
    <linearGradient id="personBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="personTeal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="23" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#2563EB" opacity="0.08"/>
    </pattern>
  </defs>

